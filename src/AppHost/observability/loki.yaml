# Loki (single binary, filesystem under /tmp — data lives as long as the container) for the Aspire AppHost.
# Logs arrive through the native OTLP endpoint (/otlp); service.name becomes the service_name label and the trace id
# is kept as structured metadata (trace_id), which Grafana links to Tempo.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # Load tests log a lot in a short time.
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
