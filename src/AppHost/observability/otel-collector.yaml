# OpenTelemetry Collector for the Aspire AppHost. Every .NET resource exports OTLP here (WithAppForwarding), and the
# collector fans out:
#   traces  -> Aspire dashboard + Tempo
#   metrics -> Aspire dashboard + Prometheus (native OTLP receiver: http.server.request.duration becomes
#              http_server_request_duration_seconds, service.name becomes the job label — same names as on Kubernetes)
#   logs    -> Aspire dashboard + Loki (native OTLP endpoint)
# The *_ENDPOINT variables are injected by AppHost.cs; ASPIRE_ENDPOINT / ASPIRE_API_KEY by the collector integration.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    # Small enough that one export stays well under gRPC's default 4 MiB message limit (Tempo, Aspire dashboard).
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 1s

exporters:
  otlp/aspire:
    endpoint: ${env:ASPIRE_ENDPOINT}
    headers:
      x-otlp-api-key: ${env:ASPIRE_API_KEY}
    tls:
      # Plain gRPC under the http launch profile; under https the dashboard uses the (possibly untrusted) dev cert.
      insecure: ${env:ASPIRE_OTLP_INSECURE}
      insecure_skip_verify: true
  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT}
    tls:
      insecure: true
  otlphttp/prometheus:
    endpoint: ${env:PROMETHEUS_ENDPOINT}/api/v1/otlp
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: ${env:LOKI_ENDPOINT}/otlp
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp/aspire, otlp/tempo ]
    metrics:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp/aspire, otlphttp/prometheus ]
    logs:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp/aspire, otlphttp/loki ]
