# Prometheus for the Aspire AppHost. Three ways in:
#   * OTLP push from the OpenTelemetry Collector (--web.enable-otlp-receiver): API + migrator metrics
#   * remote write (--web.enable-remote-write-receiver): k6 load-test metrics and Tempo's span/service-graph metrics
#   * scrapes below: PostgreSQL / Redis exporters, RabbitMQ, and the collector's and Tempo's own metrics
# Scrape targets use the Aspire container-network aliases (= resource names).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

otlp:
  # Keep service.instance.id etc. queryable through target_info, and allow the collector's batches to land slightly
  # out of order.
  keep_identifying_resource_attributes: true

storage:
  tsdb:
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]
  - job_name: otel-collector
    static_configs:
      - targets: [ "otel-collector:8888" ]
  # Tempo's own metrics: the service graph's unpaired (expired) edges are only exposed here, not remote-written.
  - job_name: tempo
    static_configs:
      - targets: [ "tempo:3200" ]
  - job_name: postgres
    static_configs:
      - targets: [ "postgres-exporter:9187" ]
  - job_name: redis
    static_configs:
      - targets: [ "redis-exporter:9121" ]
  # One exporter per standby (Postgres:Standbys): lag in seconds and the standby's own state. A target that does not
  # exist (fewer standbys) just shows as down.
  - job_name: postgres-replica
    static_configs:
      - targets: [ "postgres-exporter-replica-1:9187" ]
        labels: { replica: "1" }
      - targets: [ "postgres-exporter-replica-2:9187" ]
        labels: { replica: "2" }
  # PgBouncer's admin console (PgBouncer:Enabled): pools, waiting clients, query and wait time.
  - job_name: pgbouncer
    static_configs:
      - targets: [ "pgbouncer-exporter:9127" ]
  # The broker's built-in rabbitmq_prometheus plugin (enabled in the official image), not an exporter container.
  - job_name: rabbitmq
    static_configs:
      - targets: [ "messaging:15692" ]
  # The same plugin's per-queue view (backlog, consumers, utilisation, published / acked counters per queue), for the dashboards.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [ queue_coarse_metrics, queue_metrics, queue_delivery_metrics, queue_exchange_metrics ]
    static_configs:
      - targets: [ "messaging:15692" ]
