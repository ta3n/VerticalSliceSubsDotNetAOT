# pg_hba.conf for the primary (-c hba_file=...): the image's defaults plus the `replication` entry the standbys need
# (the default rule `host all all all scram-sha-256` does not match replication connections).
local   all         all                          trust
host    all         all         127.0.0.1/32     trust
host    all         all         ::1/128          trust
host    replication all         all              scram-sha-256
host    all         all         all              scram-sha-256
