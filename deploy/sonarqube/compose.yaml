# Local SonarQube (Community Build) for static analysis + coverage of this repo. Driven by scripts/sonar.sh / Taskfile:
#   task sonar:up      # start and wait until ready (UI: http://localhost:9000)
#   task sonar:scan    # build + tests with coverage + analysis
#   task sonar:down    # stop (data kept);  task sonar:purge  also drops the volumes
name: sonarqube

services:
  sonarqube-db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar-local-only   # local tool, never exposed outside the compose network
    volumes:
      - sonarqube-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20

  sonarqube:
    image: docker.io/library/sonarqube:26.11.0.134175-community
    depends_on:
      sonarqube-db: { condition: service_healthy }
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar-local-only
      # Embedded Elasticsearch: skip the vm.max_map_count bootstrap check (not settable inside Docker Desktop's VM).
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_TELEMETRY_ENABLE: "false"
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

volumes:
  sonarqube-db:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
