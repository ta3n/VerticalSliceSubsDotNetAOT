# Values for grafana-community/loki: one monolithic Loki on a filesystem PVC (no object storage, no caches, no gateway).
# Alloy pushes every pod's logs here; Grafana queries http://loki.observability:3100.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }

# Monolithic mode: no scalable/distributed targets.
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }

gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
sidecar:
  rules: { enabled: false }
