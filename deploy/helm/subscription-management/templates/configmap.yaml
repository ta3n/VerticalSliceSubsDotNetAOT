apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "subs.fullname" . }}
  labels:
    {{- include "subs.labels" (dict "ctx" . "component" "api") | nindent 4 }}
data:
  ASPNETCORE_HTTP_PORTS: {{ .Values.containerPort | quote }}
  Logging__LogLevel__Default: {{ .Values.config.logLevel | quote }}
  Cache__SubscriptionTtl: {{ .Values.config.cacheSubscriptionTtl | quote }}
  OpenApi__Enabled: {{ .Values.config.openApiEnabled | quote }}
  {{- with (include "subs.redis.connectionString" .) }}
  ConnectionStrings__Redis: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SERVICE_NAME: subscription-management
  OTEL_METRIC_EXPORT_INTERVAL: {{ $.Values.config.otlpMetricExportIntervalMs | quote }}
  {{- end }}
