{ { - if and .Values.s2s.enabled (not .Values.s2s.rabbitmq.auth.existingSecret) } }
apiVersion: v1
kind: Secret
metadata:
  name: { { include "subs.messaging.secretName" . } }
  labels:
    { { - include "subs.labels" (dict "ctx" . "component" "messaging") | nindent 4 } }
type: Opaque
stringData:
  rabbitmq-password: { { required "s2s.rabbitmq.auth.password is required" .Values.s2s.rabbitmq.auth.password | quote } }
  connection-string: { { printf "amqp://%s:%s@%s-messaging:5672" (.Values.s2s.rabbitmq.auth.username | urlquery | replace "+" "%20") (.Values.s2s.rabbitmq.auth.password | urlquery | replace "+" "%20") (include "subs.fullname" .) | quote } }
  { { - end } }
