{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "subs.fullname" . }}
  labels:
    {{- include "subs.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "subs.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
{{- end }}
