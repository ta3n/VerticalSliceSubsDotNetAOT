{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "subs.fullname" . }}
  labels:
    {{- include "subs.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "subs.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Kong gateway pods, plus this release's helm test pod.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.kongNamespace }}
        - podSelector:
            matchLabels:
              {{- include "subs.selectorLabels" (dict "ctx" . "component" "test") | nindent 14 }}
      ports:
        - port: http
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "subs.postgresql.fullname" . }}
  labels:
    {{- include "subs.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "subs.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "subs.selectorLabels" (dict "ctx" . "component" "api") | nindent 14 }}
      ports:
        - port: postgresql
    {{- if .Values.postgresql.metrics.enabled }}
    # Prometheus scraping the exporter sidecar.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.metrics.monitoringNamespace }}
      ports:
        - port: metrics
    {{- end }}
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "subs.redis.fullname" . }}
  labels:
    {{- include "subs.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "subs.selectorLabels" (dict "ctx" . "component" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "subs.selectorLabels" (dict "ctx" . "component" "api") | nindent 14 }}
      ports:
        - port: redis
    {{- if .Values.redis.metrics.enabled }}
    # Prometheus scraping the exporter sidecar.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.metrics.monitoringNamespace }}
      ports:
        - port: metrics
    {{- end }}
{{- end }}
{{- end }}
