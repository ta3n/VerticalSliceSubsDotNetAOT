{{- $useExisting := or (and .Values.postgresql.enabled .Values.postgresql.auth.existingSecret) (and (not .Values.postgresql.enabled) .Values.externalDatabase.existingSecret) }}
{{- if not $useExisting }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "subs.db.secretName" . }}
  labels:
    {{- include "subs.labels" (dict "ctx" . "component" "database") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "a database password is required (postgresql.auth.password or externalDatabase.password)" (include "subs.db.password" .) | quote }}
{{- end }}
