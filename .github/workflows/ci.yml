name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test-aot:
    runs-on: ubuntu-latest   # Docker is preinstalled: the integration tests use Testcontainers
    steps:
      # Pinned to commit SHAs (a tag can be repointed); the comment names the release line they belong to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - name: Native AOT publish + smoke test
        run: ./scripts/aot-smoke.sh
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt
